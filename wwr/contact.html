<html lang="en">

<head>
    <meta charset="UTF-8">

      content="creation of the contact page for rafting website (week5 assignment) including adding link icons or rather images thea a links . and they will be resized ">

    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - White Water Rafting</title>

<body>
    <header class="grid">
        <nav class="flex">
            <img src="images/rafting-logo.png" alt="some logo" width=50>
            <!-- <img src="images/tenor.gif" alt="gif of people rafting" width="150"> -->
            <!-- parenthesis is not allowed so the images/rafting(4) will not work -->
            <!-- <img class="headcover" src="images/rafting-4.jpg" alt="gif of people rafting" width=10> -->
            <div><a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav>
    </header>

    <main>


        <section class="">

            <h1>White Water Rafting Company</h1>
            <h2>123 Main River Street</h2>
            <h2>Kolob, California</h2>
            <h2>+1 999 999 9999</h2>
            <h2>info@whitewater.com</h2>

            <div class="tito">

                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d196071.1130031185!2d6.540304047428039!3d5.260748093966508!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1791893269531!5m2!1sen!2sng"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
                <form>
                    <div class="first2input">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" placeholder="placeholder"
                              required>
                        </div>
                        <div>
                            <label for="mail">Email</label>
                            <input type="email" id="mail" name="mail" placeholder="placeholder"
                              required>
                        </div>
                    </div>
                    <div class="message-purpose">
                        <label for="messagepurpose">Message purpose</label>
                        <div>
                            <label><input type="radio" id="messagepurpose"
                                  name="messagepurpose">General Inquiry</label>
                            <label><input type="radio" id="messagepurpose"
                                  name="message purpose">Reservation Question</label>
                            <label><input type="radio" id="messagepurpose"
                                  name="messagepurpose">Website Suggestion</label>
                        </div>
                    </div>

                    <div><label for="message">Message</label></div>
                    <textarea name="message" id="message"
                      placeholder="text between the tag is chosen over placeholder"
                      required>Clean the text before you type yours</textarea>
                    <div><label><input type="checkbox" id="checkbox" name="checkbox">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>
                    <button type="submit">Get in Touch</button>

                </form>
            </div>


        </section>

        <section class="ceight">
            <h2>We Are Here to Serve You</h2>
            <!-- 26-09-2026 -->
            <!-- trial -->
            <div>
                <figure>
                    <img src="images/rafting7.jpg" alt="rafting image" width="150">
                    <figcaption>Guides</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting8.jpg" alt="rafting image" width="150">
                    <figcaption>Max</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting9.jpg" alt="rafting image" width="150">
                    <figcaption>Staffs</figcaption>
                </figure>
            </div>

        </section>
    </main>


    <footer class="foot">
        <p>© 2026 🌴 White Water Rafting 🌴 Daniel Nkwocha</p>
        <nav class="socialmedia">

            <a href="https://facebook.com"><img src="images/facebook-icon.png" alt="facebook-icon"
                  width="20"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-icon.png" alt="linkedin-icon"
                  width="20"></a>
            <a href="https://instagram.com"><img src="images/instagram-icon.png"
                  alt="instagram-icon" width="20"></a>

        </nav>
